<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>AstroCore – Dev Panel (lean)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="./javascripts/astrocore.js"></script>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
        }

        #astrocanvas {
            width: 100vw;
            height: 100vh;
            display: block;
            background: #000;
        }

        /* Dev panel */
        #devpanel {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 10;
            background: rgba(20, 20, 24, .95);
            color: #eaeaea;
            border: 1px solid #3a3a45;
            border-radius: 14px;
            padding: 12px;
            width: min(480px, 92vw);
            box-shadow: 0 10px 28px rgba(0, 0, 0, .45);
            backdrop-filter: blur(3px);
            font: 13px/1.35 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            transition: height .15s ease, opacity .15s ease;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            align-items: center;
        }

        .row3 {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 8px;
            align-items: center;
        }

        .stack {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        input,
        button,
        select {
            font: inherit;
            padding: 6px 8px;
            border-radius: 8px;
            border: 1px solid #555;
            background: #0e0e12;
            color: #eee;
        }

        button {
            background: #1e88e5;
            border-color: #1669b9;
            cursor: pointer;
        }

        button.secondary {
            background: #2f3340;
            border-color: #454b5f;
        }

        button:disabled {
            opacity: .6;
            cursor: progress;
        }

        label {
            font-weight: 600
        }

        #status {
            margin-top: 6px;
            color: #a9d;
            min-height: 1.2em;
        }

        details {
            margin-top: 10px;
            border-top: 1px solid #343;
            padding-top: 8px;
        }

        summary {
            cursor: pointer;
            font-weight: 700;
        }

        .hint {
            font-size: 12px;
            opacity: .8
        }

        /* restore button that appears when minimised */
        #restoreBtn {
            position: fixed;
            left: 12px;
            top: 12px;
            z-index: 11;
            display: none;
            padding: 8px 10px;
            border-radius: 999px;
            border: 1px solid #3a3a45;
            background: rgba(20, 20, 24, .95);
            color: #eaeaea;
            cursor: pointer;
            font: 13px/1.2 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            box-shadow: 0 10px 28px rgba(0, 0, 0, .45);
            backdrop-filter: blur(3px);
        }
    </style>
</head>

<body>
    <!-- Restore button (shows only when minimised) -->
    <button id="restoreBtn" title="Show Dev Panel">Dev Panel ▲</button>

    <!-- Dev panel -->
    <div id="devpanel">
        <!-- Go To (RA, Dec) -->
        <div class="stack" style="margin-top:8px;">
            <label for="goRa">Go to (RA°, Dec°)</label>
            <div class="row3">
                <input id="goRa" type="number" step="0.0001" placeholder="RA 0–360">
                <input id="goDec" type="number" step="0.0001" placeholder="Dec −90–+90">
                <button id="btnGoTo">Go</button>
            </div>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center;">
            <div style="font-weight:800;">AstroCore – Dev Panel</div>
            <div class="hint">Globals: <code>AstroAPI</code> · <code>TAP</code></div>
        </div>

        <!-- HiPS controls -->
        <div class="stack" style="margin-top:8px;">
            <label for="hipsUrl">HiPS URL</label>
            <div class="row">
                <input id="hipsUrl" type="url" value="https://alasky.cds.unistra.fr/DSS/DSSColor/"
                    placeholder="https://…/HiPS/" />
                <button id="btnLoadHiPS">Load HiPS</button>
            </div>
        </div>

        <!-- TAP -->
        <div class="stack" style="margin-top:8px;">
            <label for="tapUrl">TAP URL</label>
            <div class="row">
                <input id="tapUrl" type="url" placeholder="https://…/tap" value="https://sky.esa.int/esasky-tap/tap" />
                <button id="btnLoadTap">Load TAP</button>
            </div>
        </div>

        <div id="status"></div>

        <!-- Datasets -->
        <details id="datasetsPanel" open style="display:none;">
            <summary>Datasets</summary>
            <div class="stack">
                <label>Catalogues</label>
                <div class="row3">
                    <select id="catalogues"></select>
                    <label class="hint" style="display:flex; align-items:center; gap:6px; user-select:none;">
                        <input id="catVisible" type="checkbox" checked />
                        Visible
                    </label>
                    <button id="btnDeleteCat" class="secondary" title="Remove catalogue from engine">Delete</button>
                </div>
                <div class="row">
                    <button id="btnShowCat">Load / Show</button>
                    <span></span>
                </div>

                <label>Footprints / Observations</label>
                <div class="row">
                    <select id="footprints"></select>
                    <button id="btnShowFp">Show</button>
                    <button id="btnHideFp" class="secondary">Hide</button>
                </div>
            </div>
        </details>

        <div style="margin-top:10px;">
            <button id="btnCamInfo" class="secondary">Camera position</button>
            <button id="btnTogglePanel" class="secondary">Minimise</button>
        </div>
    </div>

    <canvas id="astrocanvas"></canvas>

    <script>
        // ===== Fixed proxy (optional) =====
        const FIXED_PROXY_BASE = ""; // e.g. "https://my-proxy.example/"
        (function applyFixedProxy() {
            try {
                if (FIXED_PROXY_BASE) {
                    if (astrocore?.Global) astrocore.Global.corsProxyUrl = FIXED_PROXY_BASE;
                    if (astrocore?.global) astrocore.global.corsProxyUrl = FIXED_PROXY_BASE;
                    window.corsProxyUrl = FIXED_PROXY_BASE;
                }
            } catch { }
        })();

        // ===== Globals =====
        let AstroAPI, TAP;
        window.AstroAPI = AstroAPI;
        window.TAP = TAP;
        let CAT_LIST = [], FP_LIST = [];
        const CAT_VIS = new Map(); // key: catalogue key, value: boolean (isVisible)

        window.addEventListener('load', bootstrap);

        async function bootstrap() {
            try {
                const AC = new astrocore.AstroCore();
                window.AstroAPI = AstroAPI = AC;

                // Initial HiPS from input value
                await loadHiPS(el('hipsUrl').value.trim());
                AC.run();

                wireUI();
                setStatus("Ready ✅ Load a TAP to begin.");
            } catch (e) {
                console.error(e);
                setStatus("Init error: " + (e.message || e));
            }
        }

        function wireUI() {
            const btnLoadHiPS = el('btnLoadHiPS');
            const btnLoadTap = el('btnLoadTap');

            const catSel = el('catalogues');
            const catVisibleEl = el('catVisible');
            const btnShowCat = el('btnShowCat');
            const btnDeleteCat = el('btnDeleteCat');

            const fpSel = el('footprints');

            // --- GoTo RA/Dec ---
            const goRa = el('goRa');
            const goDec = el('goDec');
            const btnGo = el('btnGoTo');

            btnGo.onclick = () => {
                const ra = Number(goRa.value);
                const dec = Number(goDec.value);
                if (!Number.isFinite(ra) || !Number.isFinite(dec)) {
                    setStatus("Enter valid RA and Dec in degrees.");
                    return;
                }
                const raN = ((ra % 360) + 360) % 360;
                const decC = Math.max(-90, Math.min(90, dec));
                if (!AstroAPI?.goTo) return setStatus("AstroAPI.goTo unavailable.");
                try {
                    AstroAPI.goTo(raN, decC);
                    setStatus(`➡️ Slewed to RA=${raN.toFixed(5)}°, Dec=${decC.toFixed(5)}°`);
                } catch (e) { setStatus("goTo error: " + (e.message || e)); }
            };
            [goRa, goDec].forEach(inp => inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') btnGo.click(); }));

            // HiPS load
            btnLoadHiPS.onclick = async () => {
                const url = el('hipsUrl').value.trim();
                if (!url) return setStatus("Insert a HiPS URL.");
                try {
                    await loadHiPS(url);
                    setStatus("✅ HiPS loaded.");
                } catch (e) { setStatus("HiPS load error: " + (e.message || e)); }
            };

            // TAP load
            btnLoadTap.onclick = async () => {
                const tapUrl = el('tapUrl').value.trim();
                if (!tapUrl) return setStatus("Insert a TAP URL.");
                setStatus("Loading TAP…");
                btnLoadTap.disabled = true;
                try {
                    TAP = await astrocore.addTAPRepo(tapUrl);
                    window.TAP = TAP;

                    CAT_LIST = TAP.catalogueList || TAP.cataloguesList || [];
                    FP_LIST = TAP.obsList || TAP.footprintsList || [];

                    populateSelect(catSel, CAT_LIST, 'name');
                    CAT_LIST.forEach(c => {
                        const key = catalogueKey(c);
                        if (!CAT_VIS.has(key)) CAT_VIS.set(key, true); // default visible
                    });
                    syncCatalogueUI();

                    populateSelect(fpSel, FP_LIST, 'name');
                    el('datasetsPanel').style.display = (CAT_LIST.length || FP_LIST.length) ? '' : 'none';

                    setStatus(`✅ TAP loaded (${CAT_LIST.length} catalogues, ${FP_LIST.length} footprints).`);
                } catch (e) {
                    console.error(e);
                    setStatus("TAP load error: " + (e.message || e));
                } finally {
                    btnLoadTap.disabled = false;
                }
            };

            // ===== Catalogues wiring =====
            catSel.addEventListener('change', syncCatalogueUI);

            // Load/Show (initial load or re-show after delete+reload)
            btnShowCat.onclick = () => {
                const cat = getSelectedCatalogue();
                if (!cat) return setStatus("Select a catalogue.");
                try {
                    AstroAPI?.showCatalogue?.(cat);
                    CAT_VIS.set(catalogueKey(cat), true);
                    catVisibleEl.checked = true;
                    setStatus(`📡 Catalogue loaded: ${cat.name || cat.id || cat.table}`);
                } catch (e) { setStatus("Show error: " + (e.message || e)); }
            };

            // Visibility checkbox -> hideCatalogue(catalogue, isVisible)
            catVisibleEl.addEventListener('change', () => {
                const cat = getSelectedCatalogue();
                if (!cat) return setStatus("Select a catalogue.");
                const isVisible = !!catVisibleEl.checked;
                try {
                    AstroAPI?.hideCatalogue?.(cat, isVisible);
                    CAT_VIS.set(catalogueKey(cat), isVisible);
                    setStatus(`${isVisible ? "👁️ Visible" : "🙈 Hidden"} → ${cat.name || cat.id || cat.table}`);
                } catch (e) { setStatus("Visibility toggle error: " + (e.message || e)); }
            });

            // Delete (one-shot)
            btnDeleteCat.onclick = () => {
                const cat = getSelectedCatalogue();
                if (!cat) return setStatus("Select a catalogue.");

                const label = cat.name || cat.id || cat.table || "(unnamed)";
                try {
                    AstroAPI?.deleteCatalogue?.(cat);

                    // mark as not visible in our local toggle + reflect in UI
                    CAT_VIS.set(catalogueKey(cat), false);
                    catVisibleEl.checked = false;

                    // keep the item in CAT_LIST and in the <select>; user can click "Load / Show" to reload it
                    setStatus(`🗑️ Catalogue removed from engine (still selectable): ${label}`);
                } catch (e) {
                    setStatus("Delete error: " + (e.message || e));
                }
            };

            // ===== Footprints wiring (unchanged) =====
            el('btnShowFp').onclick = () => showDataset(fpSel.value, FP_LIST, "Footprint");
            el('btnHideFp').onclick = () => hideDataset("Footprint");

            // Camera info
            el('btnCamInfo').onclick = () => {
                if (!AstroAPI?.camera?.getCameraPosition) return setStatus("Camera API unavailable.");
                const p = AstroAPI.camera.getCameraPosition();
                setStatus(`Camera @ [${p.map(n => n.toFixed(3)).join(", ")}]`);
            };

            // minimise / restore
            el('btnTogglePanel').onclick = minimisePanel;
            el('restoreBtn').onclick = restorePanel;

            // --- helpers specific to catalogues ---
            function getSelectedCatalogue() {
                const selVal = catSel.value;
                return CAT_LIST.find(c =>
                    (c.name === selVal) || (String(c.id) === selVal) || (c.table === selVal)
                );
            }
            function catalogueKey(c) {
                return c?.name || String(c?.id) || c?.table || JSON.stringify(c);
            }
            function syncCatalogueUI() {
                const cat = getSelectedCatalogue();
                const has = !!cat;
                catVisibleEl.disabled = !has;
                btnShowCat.disabled = !has;
                btnDeleteCat.disabled = !has;
                if (!has) return;
                const key = catalogueKey(cat);
                const vis = CAT_VIS.has(key) ? CAT_VIS.get(key) : true;
                catVisibleEl.checked = !!vis;
            }
        }

        async function loadHiPS(baseUrl) {
            const hipsUrl = baseUrl.endsWith('/') ? baseUrl : baseUrl + '/';
            const resp = await fetch(hipsUrl + 'properties');
            if (!resp.ok) throw new Error(`HTTP ${resp.status} fetching properties`);
            const propsText = await resp.text();
            const desc = new astrocore.HiPSDescriptor(propsText, new URL(hipsUrl));
            AstroAPI.activateHiPS(desc, false); // insideSphere=false
        }

        // Generic show for footprints
        function showDataset(sel, list, label) {
            if (!sel) return setStatus(`Select a ${label}.`);
            const item = list.find(c => (c.name === sel) || (String(c.id) === sel) || (c.table === sel));
            if (!item) return setStatus(`${label} not found.`);
            try {
                const fn = label === "Catalogue" ? "showCatalogue" : "showFootprints";
                AstroAPI?.[fn]?.(item);
                setStatus(`${label} shown: ${item.name || item.id || item.table}`);
            } catch (e) { setStatus(`Error showing ${label.toLowerCase()}: ` + (e.message || e)); }
        }

        // Generic hide for footprints only (catalogues handled by checkbox)
        function hideDataset(label) {
            if (label === "Footprint") {
                try { AstroAPI?.hideFootprints?.(); setStatus("Footprints hidden."); }
                catch (e) { setStatus("Error hiding footprints: " + (e.message || e)); }
            }
        }

        // ===== minimise / restore =====
        function minimisePanel() {
            const panel = el('devpanel');
            panel.dataset.min = "1";
            panel.style.height = "44px";
            panel.style.overflow = "hidden";
            panel.style.opacity = "0";
            el('restoreBtn').style.display = "inline-block";
        }
        function restorePanel() {
            const panel = el('devpanel');
            panel.dataset.min = "0";
            panel.style.height = "";
            panel.style.overflow = "";
            panel.style.opacity = "1";
            el('restoreBtn').style.display = "none";
        }

        // ===== helpers =====
        function el(id) { return document.getElementById(id); }
        function setStatus(t) { el('status').textContent = t; }
        function populateSelect(sel, arr, key) {
            sel.innerHTML = "";
            arr.forEach((o, i) => {
                const opt = document.createElement('option');
                opt.value = o[key] || o.id || o.table || `#${i}`;
                opt.textContent = o[key] || o.id || o.table || `Item ${i + 1}`;
                sel.appendChild(opt);
            });
        }
    </script>
</body>

</html>
